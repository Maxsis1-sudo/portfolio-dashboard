name: Update market prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: market-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Yahoo prices
        run: python scripts/update_prices.py

      - name: Commit prices if changed
        run: |
          if git diff --quiet -- prices.json; then
            exit 0
          fi
          git config user.name "portfolio-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Update market prices"
          git push
